<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- 背景 -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
  </defs>

  <!-- 背景圆角矩形 -->
  <rect x="0" y="0" width="1024" height="1024" rx="200" ry="200" fill="url(#bgGradient)"/>

  <!-- 声波图案 -->
  <g transform="translate(512, 512)" stroke="#FFFFFF" stroke-width="40" stroke-linecap="round" fill="none">
    <!-- 左侧声波 -->
    <path d="M-80 -120 Q-120 0 -80 120" opacity="0.6"/>
    <path d="M-140 -180 Q-200 0 -140 180" opacity="0.4"/>

    <!-- 右侧声波 -->
    <path d="M80 -120 Q120 0 80 120" opacity="0.6"/>
    <path d="M140 -180 Q200 0 140 180" opacity="0.4"/>

    <!-- 中间声波 -->
    <path d="M0 -200 Q50 0 0 200" stroke-width="50"/>
  </g>

  <!-- 手指触摸点 -->
  <circle cx="512" cy="650" r="60" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="512" cy="650" r="100" stroke="#FFFFFF" stroke-width="15" fill="none" opacity="0.5"/>
</svg>